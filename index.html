
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulario accesible para actualizar el perfil de usuario">
    <title>Formulario accesible IU</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <main class="contenedor">

        <section class="formulario">

            <form action="#" method="post">

                <label for="nombre">Nombre completo</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="¿Cómo te llamas?"
                    autocomplete="name"
                    aria-required="true"
                    required>

                <label for="correo">Correo electrónico</label>
                <input
                    type="email"
                    id="correo"
                    name="correo"
                    value="aixa@gmail.com"
                    aria-required="true"
                    aria-invalid="true"
                    aria-describedby="error-correo"
                    required>

                <p class="error" id="error-correo">
                    El correo electrónico ya está registrado.
                </p>

                <label for="contrasena">Ingresar contraseña</label>

                <div class="campo-contrasena">
                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        placeholder="XXXXXXXX"
                        autocomplete="new-password"
                        aria-required="true"
                        required>

                    <button
                        type="button"
                        class="ver-contrasena"
                        aria-label="Mostrar contraseña (función pendiente)">
                        ◉
                    </button>
                </div>

                <label for="confirmar">Confirmar contraseña</label>

                <div class="campo-contrasena">
                    <input
                        type="password"
                        id="confirmar"
                        name="confirmar"
                        placeholder="XXXXXXXX"
                        autocomplete="new-password"
                        aria-required="true"
                        required>

                    <button
                        type="button"
                        class="ver-contrasena"
                        aria-label="Mostrar confirmación de contraseña (función pendiente)">
                        ◉
                    </button>
                </div>

                <button type="submit" class="actualizar">
                    Actualizar perfil
                </button>

            </form>

        </section>

        <aside class="informacion" aria-label="Estado del perfil">

            <div class="progreso" role="img"
                aria-label="Perfil completado al 65 por ciento">
                <span>65%</span>
            </div>

            <h2>Perfil completado</h2>

            <section class="tareas" aria-label="Tareas del perfil">

                <ul>
                    <li class="completada">Crear cuenta</li>
                    <li class="completada">Actualizar progreso</li>
                    <li class="completada">Configurar perfil público</li>
                    <li>Completar el primer proyecto</li>
                    <li>Invitar a tus amigos</li>
                </ul>

            </section>

        </aside>

    </main>

</body>

</html>
